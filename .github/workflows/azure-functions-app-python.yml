name: Deploy Function Apps to Azure using ZIP

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Checkout the repository with full history
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Debug: List directory contents at root
      - name: List directory contents at root
        run: ls -la

      # Debug: Find interviewScheduler directory recursively
      - name: Find interviewScheduler directory
        run: find . -type d -name "interviewScheduler"

      # Debug: Print current working directory
      - name: Print current working directory
        run: pwd

      # Set up Python environment
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      # Install dependencies for all Function Apps with error handling
      - name: Install dependencies for interviewScheduler
        run: |
          INTERVIEW_DIR=$(find . -type d -name "interviewScheduler" -print -quit)
          if [ -n "$INTERVIEW_DIR" ] && [ -f "$INTERVIEW_DIR/requirements.txt" ]; then
            pip install -r "$INTERVIEW_DIR/requirements.txt" -t "$INTERVIEW_DIR"
          else
            echo "requirements.txt not found in interviewScheduler, skipping..."
          fi

      - name: Install dependencies for MatchFilterEngine
        run: |
          MATCH_DIR=$(find . -type d -name "MatchFilterEngine" -print -quit)
          if [ -n "$MATCH_DIR" ] && [ -f "$MATCH_DIR/requirements.txt" ]; then
            pip install -r "$MATCH_DIR/requirements.txt" -t "$MATCH_DIR"
          else
            echo "requirements.txt not found in MatchFilterEngine, skipping..."
          fi

      - name: Install dependencies for ResumeUploadUI
        run: |
          RESUME_DIR=$(find . -type d -name "ResumeUploadUI" -print -quit)
          if [ -n "$RESUME_DIR" ] && [ -f "$RESUME_DIR/requirements.txt" ]; then
            pip install -r "$RESUME_DIR/requirements.txt" -t "$RESUME_DIR"
          else
            echo "requirements.txt not found in ResumeUploadUI, skipping..."
          fi

      # Log in to Azure
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # Package and deploy interviewScheduler
      - name: Package interviewScheduler
        run: |
          INTERVIEW_DIR=$(find . -type d -name "interviewScheduler" -print -quit)
          if [ -n "$INTERVIEW_DIR" ]; then
            cd "$INTERVIEW_DIR"
            zip -r ../../interviewScheduler.zip .
          else
            echo "interviewScheduler directory not found, skipping..."
            exit 1
          fi

      - name: Deploy interviewScheduler
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'interviewScheduler'
          package: 'interviewScheduler.zip'

      # Package and deploy MatchFilterEngine
      - name: Package MatchFilterEngine
        run: |
          MATCH_DIR=$(find . -type d -name "MatchFilterEngine" -print -quit)
          if [ -n "$MATCH_DIR" ]; then
            cd "$MATCH_DIR"
            zip -r ../../MatchFilterEngine.zip .
          else
            echo "MatchFilterEngine directory not found, skipping..."
            exit 1
          fi

      - name: Deploy MatchFilterEngine
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'MatchFilterEngine'
          package: 'MatchFilterEngine.zip'

      # Package and deploy ResumeUploadUI Function
      - name: Package ResumeUploadUI Function
        run: |
          RESUME_DIR=$(find . -type d -name "ResumeUploadUI" -print -quit)
          if [ -n "$RESUME_DIR" ]; then
            cd "$RESUME_DIR"
            zip -r ../../ResumeUploadUIFunction.zip .
          else
            echo "ResumeUploadUI directory not found, skipping..."
            exit 1
          fi

      - name: Deploy ResumeUploadUI Function
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'ResumeUploadUIFunction'
          package: 'ResumeUploadUIFunction.zip'
