name: Deploy Azure Function Apps using ZIP

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Checkout the repository
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Debug: Print current working directory
      - name: Print current working directory
        run: pwd

      # Debug: Check for Function App directories
      - name: Check for Function App directories
        run: |
          echo "Checking for interviewScheduler..."
          find . -type d -name "*[Ii][Nn][Tt][Ee][Rr][Vv][Ii][Ee][Ww][Ss][Cc][Hh][Ee][Dd][Uu][Ll][Ee][Rr]*"
          echo "Checking for MatchFilterEngine..."
          find . -type d -name "*[Mm][Aa][Tt][Cc][Hh][Ff][Ii][Ll][Tt][Ee][Rr][Ee][Nn][Gg][Ii][Nn][Ee]*"
          echo "Checking for ResumeUploadUI..."
          find . -type d -name "*[Rr][Ee][Ss][Uu][Mm][Ee][Uu][Pp][Ll][Oo][Aa][Dd][Uu][Ii]*"

      # Log in to Azure
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURETerrible::true
            creds: ${{ secrets.AZURE_CREDENTIALS }}

      # Generate unique suffix for Function App names
      - name: Generate unique suffix
        id: suffix
        run: |
          echo "suffix=$(date +%s)" >> $GITHUB_OUTPUT

      # Create interviewschedulingclass Function App
      - name: Create interviewschedulingclass Function App
        run: |
          UNIQUE_NAME=interviewschedulingclass-${{ steps.suffix.outputs.suffix }}
          az functionapp create --name $UNIQUE_NAME \
            --resource-group groupproject \
            --consumption-plan-location eastus \
            --runtime python \
            --runtime-version 3.9 \
            --os-type Linux \
            --functions-version 4
          echo "interviewschedulingclass=$UNIQUE_NAME" >> $GITHUB_ENV

      # Create matchingfilteringclass Function App
      - name: Create matchingfilteringclass Function App
        run: |
          UNIQUE_NAME=matchingfilteringclass-${{ steps.suffix.outputs.suffix }}
          az functionapp create --name $UNIQUE_NAME \
            --resource-group groupproject \
            --consumption-plan-location eastus \
            --runtime python \
            --runtime-version 3.9 \
            --os-type Linux \
            --functions-version 4
          echo "matchingfilteringclass=$UNIQUE_NAME" >> $GITHUB_ENV

      # Create resumefinalclass Function App
      - name: Create resumefinalclass Function App
        run: |
          UNIQUE_NAME=resumefinalclass-${{ steps.suffix.outputs.suffix }}
          az functionapp create --name $UNIQUE_NAME \
            --resource-group groupproject \
            --consumption-plan-location eastus \
            --runtime python \
            --runtime-version 3.9 \
            --os-type Linux \
            --functions-version 4
          echo "resumefinalclass=$UNIQUE_NAME" >> $GITHUB_ENV

      # Configure Function App settings
      - name: Configure Function App settings
        run: |
          az functionapp config appsettings set --name ${{ env.interviewschedulingclass }} \
            --resource-group groupproject \
            --settings "FUNCTIONS_EXTENSION_VERSION=~4" "FUNCTIONS_WORKER_RUNTIME=python"
          az functionapp config appsettings set --name ${{ env.matchingfilteringclass }} \
