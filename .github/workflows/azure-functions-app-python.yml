name: Deploy Azure Function Apps using ZIP

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Checkout the repository
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Debug: List directory contents at root
      - name: List directory contents at root
        run: ls -la

      # Debug: List all directories recursively
      - name: List all directories recursively
        run: find . -type d

      # Debug: Print current working directory
      - name: Print current working directory
        run: pwd

      # Debug: Check for Function App directories
      - name: Check for Function App directories
        run: |
          echo "Checking for interviewScheduler..."
          find . -type d -name "*interviewScheduler*" -o -name "*InterviewScheduler*"
          echo "Checking for MatchFilterEngine..."
          find . -type d -name "*MatchFilterEngine*" -o -name "*matchfilterengine*"
          echo "Checking for ResumeUploadUI..."
          find . -type d -name "*ResumeUploadUI*" -o -name "*resumeuploadui*"

      # Log in to Azure
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
          
      # Debug: List existing Function Apps
      - name: List existing Function Apps
        run: |
          az functionapp list --resource-group groupproject974c --query "[].name" -o tsv

      # Create interviewschedulingclass Function App
      - name: Create interviewschedulingclass Function App
        run: |
          az functionapp create --name interviewschedulingclass \
            --resource-group groupproject974c \
            --consumption-plan-location eastus \
            --runtime python \
            --runtime-version 3.9 \
            --os-type Linux \
            --storage-account ${{ env.STORAGE_ACCOUNT }} \
            || echo "Failed to create interviewschedulingclass Function App or it already exists."
          echo "interviewschedulingclass Function App creation attempted."

      # Create matchingfilteringclass Function App
      - name: Create matchingfilteringclass Function App
        run: |
          az functionapp create --name matchingfilteringclass \
            --resource-group groupproject974c \
            --consumption-plan-location eastus \
            --runtime python \
            --runtime-version 3.9 \
            --os-type Linux \
            --storage-account ${{ env.STORAGE_ACCOUNT }} \
            || echo "Failed to create matchingfilteringclass Function App or it already exists."
          echo "matchingfilteringclass Function App creation attempted."

      # Create resumefinalclass Function App
      - name: Create resumefinalclass Function App
        run: |
          az functionapp create --name resumefinalclass \
            --resource-group groupproject974c \
            --consumption-plan-location eastus \
            --runtime python \
            --runtime-version 3.9 \
            --os-type Linux \
            --storage-account ${{ env.STORAGE_ACCOUNT }} \
            || echo "Failed to create resumefinalclass Function App or it already exists."
          echo "resumefinalclass Function App creation attempted."

      # Debug: List Function Apps after creation
      - name: List Function Apps after creation
        run: |
          az functionapp list --resource-group groupproject974c --query "[].name" -o tsv

      # Set up Python environment
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      # Install dependencies for all Function Apps
      - name: Install dependencies for interviewScheduler
        run: |
          INTERVIEW_DIR=$(find . -type d -name "*interviewScheduler*" -o -name "*InterviewScheduler*" -print -quit)
          if [ -n "$INTERVIEW_DIR" ] && [ -f "$INTERVIEW_DIR/requirements.txt" ]; then
            echo "Installing dependencies for interviewScheduler in $INTERVIEW_DIR"
            pip install -r "$INTERVIEW_DIR/requirements.txt" -t "$INTERVIEW_DIR"
          else
            echo "interviewScheduler or its requirements.txt not found, skipping..."
          fi

      - name: Install dependencies for MatchFilterEngine
        run: |
          MATCH_DIR=$(find . -type d -name "*MatchFilterEngine*" -o -name "*matchfilterengine*" -print -quit)
          if [ -n "$MATCH_DIR" ] && [ -f "$MATCH_DIR/requirements.txt" ]; then
            echo "Installing dependencies for MatchFilterEngine in $MATCH_DIR"
            pip install -r "$MATCH_DIR/requirements.txt" -t "$MATCH_DIR"
          else
            echo "MatchFilterEngine or its requirements.txt not found, skipping..."
          fi

      - name: Install dependencies for ResumeUploadUI
        run: |
          RESUME_DIR=$(find . -type d -name "*ResumeUploadUI*" -o -name "*resumeuploadui*" -print -quit)
          if [ -n "$RESUME_DIR" ] && [ -f "$RESUME_DIR/requirements.txt" ]; then
            echo "Installing dependencies for ResumeUploadUI in $RESUME_DIR"
            pip install -r "$RESUME_DIR/requirements.txt" -t "$RESUME_DIR"
          else
            echo "ResumeUploadUI or its requirements.txt not found, skipping..."
          fi

      # Package and deploy interviewScheduler to interviewschedulingclass Function App
      - name: Package interviewScheduler Function App
        run: |
          INTERVIEW_DIR=$(find . -type d -name "*interviewScheduler*" -o -name "*InterviewScheduler*" -print -quit)
          if [ -n "$INTERVIEW_DIR" ]; then
            echo "Packaging interviewScheduler from $INTERVIEW_DIR"
            cd "$INTERVIEW_DIR"
            zip -r interviewScheduler.zip .
            mv interviewScheduler.zip "$GITHUB_WORKSPACE"
          else
            echo "interviewScheduler directory not found, failing..."
            exit 1
          fi

      - name: Deploy interviewScheduler to interviewschedulingclass Function App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'interviewschedulingclass'
          package: 'interviewScheduler.zip'
          slot-name: 'production'

      # Package and deploy MatchFilterEngine to matchingfilteringclass Function App
      - name: Package MatchFilterEngine Function App
        run: |
          MATCH_DIR=$(find . -type d -name "*MatchFilterEngine*" -o -name "*matchfilterengine*" -print -quit)
          if [ -n "$MATCH_DIR" ]; then
            echo "Packaging MatchFilterEngine from $MATCH_DIR"
            cd "$MATCH_DIR"
            zip -r MatchFilterEngine.zip .
            mv MatchFilterEngine.zip "$GITHUB_WORKSPACE"
          else
            echo "MatchFilterEngine directory not found, failing..."
            exit 1
          fi

      - name: Deploy MatchFilterEngine to matchingfilteringclass Function App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'matchingfilteringclass'
          package: 'MatchFilterEngine.zip'
          slot-name: 'production'

      # Package and deploy ResumeUploadUI to resumefinalclass Function App
      - name: Package ResumeUploadUI Function App
        run: |
          RESUME_DIR=$(find . -type d -name "*ResumeUploadUI*" -o -name "*resumeuploadui*" -print -quit)
          if [ -n "$RESUME_DIR" ]; then
            echo "Packaging ResumeUploadUI from $RESUME_DIR"
            cd "$RESUME_DIR"
            zip -r ResumeUploadUI.zip .
            mv ResumeUploadUI.zip "$GITHUB_WORKSPACE"
          else
            echo "ResumeUploadUI directory not found, failing..."
            exit 1
          fi

      - name: Deploy ResumeUploadUI to resumefinalclass Function App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'resumefinalclass'
          package: 'ResumeUploadUI.zip'
          slot-name: 'production'
