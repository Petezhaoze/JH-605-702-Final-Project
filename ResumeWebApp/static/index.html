<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Upload Resume – SOJAS</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    :root {
      --primary: #0078d4;
      --background: #f7f9fc;
      --shadow: 0 4px 12px rgba(0, 0, 0, 0.1);
      --radius: 10px;
    }

    body {
      margin: 0;
      font-family: "Segoe UI", sans-serif;
      background: var(--background);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .upload-container {
      background: white;
      padding: 40px;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      text-align: center;
      max-width: 400px;
      width: 100%;
    }

    h2 {
      color: var(--primary);
      margin-bottom: 10px;
    }

    p {
      font-size: 14px;
      color: #555;
      margin-bottom: 20px;
    }

    input[type="file"] {
      display: none;
    }

    input[type="email"] {
      width: 100%;
      padding: 10px;
      margin-bottom: 15px;
      border: 1px solid #aaa;
      border-radius: var(--radius);
      font-size: 14px;
    }

    input[type="email"]:focus {
      border-color: var(--primary);
      outline: none;
    }

    .file-label {
      display: inline-block;
      padding: 12px 24px;
      border: 2px dashed #aaa;
      border-radius: var(--radius);
      background: #f1f1f1;
      cursor: pointer;
      margin-bottom: 10px;
      transition: border-color 0.3s ease;
    }

    .file-label:hover {
      border-color: var(--primary);
    }

    .file-name {
      font-size: 13px;
      color: #777;
      margin-bottom: 20px;
    }

    button {
      background-color: var(--primary);
      color: white;
      border: none;
      padding: 12px 24px;
      font-size: 16px;
      border-radius: var(--radius);
      cursor: pointer;
      transition: background 0.3s ease;
    }

    button:hover {
      background-color: #005fa3;
    }

    #status {
      margin-top: 20px;
      font-weight: bold;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="upload-container">
    <h2>Upload Your Resume</h2>
    <p>PDF, DOC, or DOCX up to 2MB</p>

    <form id="uploadForm">
      <input type="email" id="emailInput" name="email" placeholder="Enter your email" required />
      <label for="fileInput" class="file-label">📎 Choose Resume File</label>
      <input type="file" id="fileInput" name="resume" accept=".pdf,.doc,.docx" required />
      <div class="file-name" id="fileName">No file selected</div>
      <button type="submit">Upload</button>
    </form>

    <div id="status"></div>
  </div>

  <script>
    const fileInput = document.getElementById('fileInput');
    const emailInput = document.getElementById('emailInput');
    const fileNameDisplay = document.getElementById('fileName');
    const status = document.getElementById('status');

    fileInput.addEventListener('change', () => {
      fileNameDisplay.textContent = fileInput.files[0]?.name || "No file selected";
    });

    document.getElementById('uploadForm').addEventListener('submit', async function (e) {
      e.preventDefault();
      const file = fileInput.files[0];
      const email = emailInput.value;

      if (!file) {
        status.textContent = "❌ Please select a file.";
        return;
      }

      if (!email) {
        status.textContent = "❌ Please enter an email.";
        return;
      }

      const formData = new FormData();
      formData.append('resume', file);
      formData.append('email', email);

      status.textContent = "⏳ Uploading...";

      try {
        const response = await fetch('/upload_resume', {
          method: 'POST',
          body: formData
        });

        const result = await response.json();
        status.textContent = result.message.includes("✅") ? result.message : "❌ Upload failed.";
      } catch (error) {
        status.textContent = "❌ Error during upload.";
        console.error(error);
      }
    });
  </script>
</body>
</html>
